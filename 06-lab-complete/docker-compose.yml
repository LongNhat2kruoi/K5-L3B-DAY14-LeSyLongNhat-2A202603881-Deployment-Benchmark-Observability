services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  agent:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-key}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
